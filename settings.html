<div class="lmb_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Lorebook Manager</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="lmb_settings_page_size">Lorebooks per page</label>
            <select id="lmb_settings_page_size" class="text_pole">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <label for="lmb_settings_desktop_columns">Desktop columns</label>
            <select id="lmb_settings_desktop_columns" class="text_pole">
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            <small class="notes">Used on desktop screens wider than 1200px. Touch layouts keep their mobile grid.</small>
        </div>
    </div>
</div>
